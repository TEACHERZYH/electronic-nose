data:
  source: zenodo_15681119
  archive: data/raw/Dataset.zip
  extracted_root: data/raw/extracted
  expected_size_bytes: 141110296
  expected_md5: 9937678cac4118c53287276009172a74
  expected_measurements: 700
  expected_official_feature_rows: 624
  expected_valid_dates: 39
  expected_sensors: 62
  expected_class_counts:
    EtOH: 232
    Diacetyl 0.1 ppm: 117
    Diacetyl 1 ppm: 117
    2-Phenylethanol 200 ppm: 117
    2-Phenylethanol 1000 ppm: 117
  excluded_day_labels:
  - 14
split:
  unit: date
  train_dates: 24
  validation_dates: 7
  test_dates: 8
  same_date_must_stay_together: true
anchors:
  class_pattern: ^EtOH$
  candidate_count_per_date: 3
  minimum_causal_count_per_date: 2
  expected_candidate_count: 116
  expected_scored_split_counts:
    train: 360
    validation: 105
    test: 119
  budgets:
  - 0
  - 1
  - 3
  budget_3_semantics: maximum_three_preceding_initial_references
  allow_partial_budget_3_on_short_days: true
  exclude_candidates_from_all_scoring_sets: true
features:
  primary_representation: relative
  sensitivity_representations:
  - log
  cycle_stage_map:
    1: baseline
    2: exposure
    3: recovery
  cycle_stage_map_evidence: official Dataset.zip/feature_extraction.ipynb
  include_temperature_humidity_in_primary: true
  include_baseline_controls_for_stage0: true
  official_feature_table_role: provenance_only
  raw_response_descriptors:
  - amplitude
  - initial_slope
  - overall_slope
  - auc
  - time_to_peak_s
  - recovery_rate
  - recovery_tau_s
stage0:
  controls:
  - observed_ordinal
  - position_only
  - baseline_only
  - temperature_humidity_only
  - recovery_history_only
  - clustered_permutation
  - random_row
  - chronological_forward
  permutation_repeats: 200
  random_row:
    required_coverage_split: test
    coverage_unit: date_x_class
    minimum_per_date_class: 1
    preserve_partition_sizes: match_locked_time_split
    remaining_quota: stratified_by_class
  gate:
    permutation_upper_quantile: 0.975
    proxy_near_margin_macro_f1: 0.02
    branches:
      response: RESPONSE_MAINLINE
      protocol_conditioned: PROTOCOL_CONDITIONED_MAINLINE
      audit_only: AUDIT_ONLY
tcss:
  alpha: 0.75
  group_lambda: 0.01
  stability_resamples: 200
  coefficient_tolerance: 1.0e-06
  relative_objective_tolerance: 1.0e-06
  stable_iterations: 5
  max_iterations: 500
  backtracking_factor: 0.5
  initial_step_size: 1.0
  environments: 6
  dates_per_environment: 4
  sensor_budgets:
  - 8
  - 16
  - 32
  - 62
  seeds:
  - 11
  - 23
  - 37
  - 53
  - 71
masking:
  train_max_fraction: 0.25
  unavailable_counts:
  - 0
  - 1
  - 4
  - 8
  - 16
  strategies:
  - random
  - influence
  include_explicit_mask: true
calibration:
  method: temperature_scaling
  fixed_coverage: 0.5
statistics:
  cluster_unit: date
  bootstrap_replicates: 10000
  confidence_level: 0.95
  seed_average_before_bootstrap: true
  holm_for_exploratory_baselines: true
